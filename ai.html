<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hub Mega Ultimate v6</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        /* ===== THEMES ===== */
        :root {
            --grad-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --input-bg: rgba(15,23,42,0.9);
            --sidebar-bg: rgba(10,15,25,0.98);
            --accent: #38bdf8;
            --accent-fg: #0f172a;
            --msg-user-bg: #334155;
            --msg-text: #f1f5f9;
            --border: rgba(255,255,255,0.1);
            --sub-text: #94a3b8;
            --input-border: rgba(255,255,255,0.1);
            --chat-item-bg: rgba(255,255,255,0.03);
            --settings-input-bg: #0f172a;
            --settings-border: #334155;
            --pre-bg: #000;
            --pre-border: #1e293b;
        }
        [data-theme="light"] {
            --grad-bg: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%);
            --input-bg: rgba(255,255,255,0.95);
            --sidebar-bg: rgba(248,250,252,0.99);
            --accent: #0ea5e9;
            --accent-fg: #ffffff;
            --msg-user-bg: #0ea5e9;
            --msg-text: #1e293b;
            --border: rgba(0,0,0,0.1);
            --sub-text: #64748b;
            --input-border: rgba(0,0,0,0.15);
            --chat-item-bg: rgba(0,0,0,0.03);
            --settings-input-bg: #f1f5f9;
            --settings-border: #cbd5e1;
            --pre-bg: #1e293b;
            --pre-border: #334155;
        }
        [data-theme="transparent"] {
            --grad-bg: url('https://images.unsplash.com/photo-1464802686167-b939a6910659?auto=format&fit=crop&q=80&w=2000') center/cover no-repeat fixed;
            --input-bg: rgba(255,255,255,0.1);
            --sidebar-bg: rgba(0,0,0,0.7);
            --accent: #00d2ff;
            --accent-fg: #000;
            --msg-user-bg: rgba(56,189,248,0.3);
            --msg-text: #fff;
            --border: rgba(255,255,255,0.2);
            --sub-text: #e2e8f0;
            --input-border: rgba(255,255,255,0.3);
            --chat-item-bg: rgba(255,255,255,0.1);
            --settings-input-bg: rgba(0,0,0,0.4);
            --settings-border: rgba(255,255,255,0.2);
            --pre-bg: rgba(0,0,0,0.8);
            --pre-border: rgba(255,255,255,0.1);
        }
        [data-theme="transparent"] body::before { content: ""; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: -1; }

        /* ===== BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--grad-bg); color: var(--msg-text); height: 100dvh; display: flex; justify-content: center; overflow: hidden; transition: background 0.3s; }
        .app-container { width: 100%; max-width: 850px; height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }

        #menu-btn { position: absolute; top: 15px; left: 15px; z-index: 50; background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; backdrop-filter: blur(10px); }
        #sidebar { position: fixed; top: 0; left: -320px; width: 310px; height: 100%; background: var(--sidebar-bg); z-index: 100; transition: 0.3s cubic-bezier(0.4,0,0.2,1); padding: 20px; display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.5); backdrop-filter: blur(15px); }
        #sidebar.open { left: 0; }
        .sidebar-header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; display: none; }
        #sidebar.open ~ #sidebar-overlay { display: block; }

        #new-chat-btn { background: transparent; border: 1px dashed var(--accent); color: var(--accent); padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; font-weight: bold; width: 100%; }
        #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .chat-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; background: var(--chat-item-bg); cursor: pointer; font-size: 13px; border: 1px solid transparent; }
        .chat-item.active { border-color: var(--accent); background: rgba(56,189,248,0.1); }
        .del-btn { color: var(--sub-text); background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px 5px; border-radius: 4px; transition: 0.2s; }
        .del-btn:hover { color: #ef4444; background: rgba(239,68,68,0.1); }

        .settings-pane { border-top: 1px solid var(--border); padding-top: 15px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; overflow-y: auto; max-height: 55vh; }
        .setting-field label { font-size: 11px; color: var(--sub-text); text-transform: uppercase; margin-bottom: 3px; display: block; }
        .setting-field select, .setting-field input { width: 100%; background: var(--settings-input-bg); border: 1px solid var(--settings-border); color: var(--msg-text); padding: 8px; border-radius: 6px; font-size: 13px; outline: none; }
        #save-settings { background: var(--accent); color: var(--accent-fg); border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px; padding-top: 70px; display: flex; flex-direction: column; gap: 20px; position: relative; scroll-behavior: auto; }
        #welcome-screen { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); text-align: center; width: 100%; pointer-events: none; z-index: 1; }
        #welcome-screen h1 { font-size: 24px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .user-wrapper { align-self: flex-end; max-width: 85%; z-index: 2; }
        .user-msg { background: var(--msg-user-bg); padding: 12px 16px; border-radius: 18px 18px 4px 18px; cursor: pointer; font-size: 15px; word-wrap: break-word; backdrop-filter: blur(5px); }
        .ai-msg { align-self: flex-start; width: 100%; font-size: 15px; line-height: 1.6; word-wrap: break-word; z-index: 2; }

        .error-container { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; color: #fca5a5; padding: 15px; border-radius: 8px; font-size: 14px; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .retry-btn { align-self: flex-start; background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; }

        .file-preview-bubble { background: rgba(255,255,255,0.07); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 12px; color: var(--sub-text); display: flex; align-items: center; gap: 8px; }
        .file-preview-bubble img { max-width: 200px; max-height: 140px; border-radius: 8px; display: block; }

        pre { background: var(--pre-bg) !important; border-radius: 6px; margin: 15px 0; border: 1px solid var(--pre-border); position: relative; overflow-x: auto; }
        code { font-family: 'JetBrains Mono', monospace; font-size: 13px; display: block; padding: 12px !important; white-space: pre; }
        .copy-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(255,255,255,0.1); color: var(--sub-text); border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .thinking-bubble { align-self: flex-start; background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 4px 18px 18px 18px; color: var(--accent); font-size: 14px; }

        #input-area { padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        #file-preview-bar { display: flex; flex-wrap: wrap; gap: 6px; }
        .fp-chip { background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
        .fp-chip button { background: none; border: none; color: var(--sub-text); cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
        #input-row { display: flex; gap: 10px; align-items: center; }
        #attach-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; transition: background 0.2s; }
        #attach-btn:hover { background: rgba(255,255,255,0.1); }
        #attach-btn svg { width: 18px; height: 18px; stroke: var(--sub-text); fill: none; stroke-width: 2; }
        #file-input { display: none; }
        #inp { flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 25px; padding: 14px 20px; color: var(--msg-text); outline: none; font-size: 15px; backdrop-filter: blur(10px); }
        #send-btn { background: var(--accent); border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        #send-btn svg { width: 22px; height: 22px; fill: var(--accent-fg); }
    </style>
</head>
<body>

<button id="menu-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>

<div id="sidebar">
    <div class="sidebar-header"><h3>AI Hub Sessions</h3></div>
    <button id="new-chat-btn" onclick="createNew()">Obrolan Baru</button>
    <div id="chat-list"></div>
    <div class="settings-pane">

        <div class="setting-field"><label>API Key</label><input type="password" id="set-key" placeholder="Key Anda..."></div>

        <div class="setting-field">
            <label>Endpoint</label>
            <select id="set-url">
                <option value="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions">Google Gemini API</option>
                <option value="https://api.anthropic.com/v1/messages">Anthropic Claude</option>
                <option value="https://api.openai.com/v1/chat/completions">OpenAI GPT</option>
                <option value="https://api.groq.com/openai/v1/chat/completions">Groq Cloud</option>
                <option value="https://api.deepseek.com/chat/completions">DeepSeek Official</option>
                <option value="https://api.mistral.ai/v1/chat/completions">Mistral AI</option>
                <option value="https://api.together.xyz/v1/chat/completions">Together AI</option>
                <option value="https://api.fireworks.ai/inference/v1/chat/completions">Fireworks AI</option>
                <option value="https://openrouter.ai/api/v1/chat/completions">OpenRouter</option>
                <option value="https://api-inference.huggingface.co/v1/chat/completions">HuggingFace</option>
                <option value="https://api.moonshot.cn/v1/chat/completions">Moonshot AI (Kimi)</option>
                <option value="https://api.cohere.ai/v2/chat">Cohere Command</option>
                <option value="https://api.bluesminds.com/v1/chat/completions">Bluesminds Multi-API</option>
                <option value="custom_url">Tambah Endpoint Manual...</option>
            </select>
        </div>

        <div class="setting-field">
            <label>AI Model</label>
            <select id="set-mod">
                <optgroup label="Claude (Anthropic)">
                    <option value="claude-opus-4-6">Claude Opus 4.6</option>
                    <option value="claude-opus-4-5">Claude Opus 4.5</option>
                    <option value="claude-sonnet-4-5">Claude Sonnet 4.5</option>
                    <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                    <option value="claude-3-5-haiku-20241022">Claude 3.5 Haiku</option>
                    <option value="claude-3-opus-20240229">Claude 3 Opus</option>
                </optgroup>
                <optgroup label="Gemini (Google)">
                    <option value="gemini-2.5-pro-preview-05-06">Gemini 2.5 Pro</option>
                    <option value="gemini-2.5-flash-preview-04-17">Gemini 2.5 Flash</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                    <option value="gemini-2.0-flash-thinking-exp">Gemini 2.0 Flash Thinking</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                </optgroup>
                <optgroup label="GPT (OpenAI)">
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-4o-mini">GPT-4o Mini</option>
                    <option value="gpt-4-turbo">GPT-4 Turbo</option>
                    <option value="o1">o1</option>
                    <option value="o3">o3</option>
                </optgroup>
                <optgroup label="Groq (Ultra Cepat)">
                    <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
                    <option value="mixtral-8x7b-32768">Mixtral 8x7B</option>
                    <option value="llama-3.2-90b-vision-preview">Llama 3.2 90B Vision</option>
                </optgroup>
                <optgroup label="DeepSeek">
                    <option value="deepseek-chat">DeepSeek V3 Chat</option>
                    <option value="deepseek-reasoner">DeepSeek R1 Reasoner</option>
                </optgroup>
                <optgroup label="OpenRouter">
                    <option value="anthropic/claude-3.5-sonnet">OR: Claude 3.5 Sonnet</option>
                    <option value="deepseek/deepseek-r1">OR: DeepSeek R1</option>
                    <option value="google/gemini-2.0-flash-exp:free">OR: Gemini 2.0 Flash (Free)</option>
                </optgroup>
                <option value="custom_mod">Tambah Model Manual...</option>
            </select>
        </div>

        <div class="setting-field">
            <label>Tema</label>
            <select id="set-theme" onchange="setTheme(this.value)">
                <option value="dark">Gelap (Dark)</option>
                <option value="light">Siang (Light)</option>
                <option value="transparent">Transparan (Glass)</option>
            </select>
        </div>

        <button id="save-settings" onclick="saveSettings()">Simpan & Terapkan</button>
    </div>
</div>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="app-container" onclick="closeSidebar()">
    <div id="welcome-screen"><h1>Mau tanya apa hari ini?</h1></div>
    <div id="chat-window"></div>
    <div id="input-area">
        <div id="file-preview-bar"></div>
        <div id="input-row">
            <button id="attach-btn" title="Upload file" onclick="document.getElementById('file-input').click()">
                <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.41 17.41a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="file-input" multiple accept="image/*,.txt,.js,.ts,.jsx,.tsx,.py,.json,.html,.css,.md,.csv,.xml,.yaml,.yml,.php,.java,.c,.cpp,.h,.go,.rs,.rb,.sh,.bash,.sql,.env,.toml,.ini,.log">
            <input type="text" id="inp" placeholder="Ketik pesan..." autocomplete="off">
            <button id="send-btn" onclick="handleAction()">
                <svg id="send-svg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                <svg id="stop-svg" style="display:none" width="20" height="20" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor"></rect></svg>
            </button>
        </div>
    </div>
</div>

<script>
    // ===== STATE =====
    let sessions = JSON.parse(localStorage.getItem('sessions')) || [];
    let currentId = localStorage.getItem('current_id') || null;
    let apiKey = localStorage.getItem('api_key') || "";
    let apiUrl = localStorage.getItem('api_url') || "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions";
    let apiMod = localStorage.getItem('api_mod') || "gemini-2.0-flash";
    let currentTheme = localStorage.getItem('theme') || 'dark';
    let isGen = false, abortController = null;
    let pendingFiles = [];

    const chatWindow = document.getElementById('chat-window');
    const inp = document.getElementById('inp');
    const sidebar = document.getElementById('sidebar');
    const filePreviewBar = document.getElementById('file-preview-bar');

    function setTheme(t) {
        currentTheme = t;
        document.documentElement.setAttribute('data-theme', t === 'dark' ? '' : t);
        localStorage.setItem('theme', t);
        document.getElementById('set-theme').value = t;
    }
    setTheme(currentTheme);

    function initDropdowns() {
        document.getElementById('set-key').value = apiKey;
        document.getElementById('set-url').value = apiUrl;
        document.getElementById('set-mod').value = apiMod;
        document.getElementById('set-theme').value = currentTheme;
    }

    function saveSettings() {
        apiKey = document.getElementById('set-key').value;
        apiUrl = document.getElementById('set-url').value;
        apiMod = document.getElementById('set-mod').value;
        currentTheme = document.getElementById('set-theme').value;
        localStorage.setItem('api_key', apiKey);
        localStorage.setItem('api_url', apiUrl);
        localStorage.setItem('api_mod', apiMod);
        setTheme(currentTheme);
        closeSidebar();
    }

    // ===== SESSIONS LOGIC =====
    function renderSessions() {
        const list = document.getElementById('chat-list');
        list.innerHTML = "";
        sessions.forEach(s => {
            const div = document.createElement('div');
            div.className = `chat-item ${s.id === currentId ? 'active' : ''}`;
            div.onclick = (e) => { e.stopPropagation(); loadSess(s.id); closeSidebar(); };
            div.innerHTML = `<span>${s.title}</span><button class="del-btn" onclick="delSess('${s.id}', event)">🗑</button>`;
            list.appendChild(div);
        });
    }

    function delSess(id, e) {
        e.stopPropagation();
        sessions = sessions.filter(s => s.id !== id);
        if (!sessions.length) createNew(); 
        else if (currentId === id) loadSess(sessions[0].id);
        saveData();
        renderSessions();
    }

    // LOGIKA PERMINTAAN: JANGAN TAMBAH JIKA MASIH KOSONG
    function createNew() {
        const activeSess = sessions.find(s => s.id === currentId);
        // Jika sesi aktif sudah ada dan isinya masih kosong, jangan bikin baru lagi
        if (activeSess && activeSess.messages.length === 0) {
            closeSidebar();
            return;
        }

        const id = Date.now().toString();
        sessions.unshift({ id, title: "Obrolan Baru", messages: [] });
        currentId = id;
        saveData();
        loadSess(id);
        closeSidebar();
    }

    function loadSess(id) {
        currentId = id;
        chatWindow.innerHTML = "";
        const s = sessions.find(x => x.id === id);
        if (s) {
            s.messages.forEach(m => displayMsg(m.role, m.displayText || m.content, m.filesMeta));
            document.getElementById('welcome-screen').style.display = s.messages.length ? 'none' : 'block';
        }
        chatWindow.scrollTop = chatWindow.scrollHeight;
        renderSessions();
    }

    function saveData() { localStorage.setItem('sessions', JSON.stringify(sessions)); localStorage.setItem('current_id', currentId); }

    // ===== FILE & CHAT =====
    document.getElementById('file-input').addEventListener('change', async (e) => {
        for (const file of e.target.files) await readFile(file);
        e.target.value = "";
        renderFileBar();
    });

    function readFile(file) {
        return new Promise(resolve => {
            const isImage = file.type.startsWith('image/');
            const reader = new FileReader();
            if (isImage) {
                reader.readAsDataURL(file);
                reader.onload = () => { pendingFiles.push({ name: file.name, type: file.type, content: reader.result, isImage: true }); resolve(); };
            } else {
                reader.readAsText(file);
                reader.onload = () => { pendingFiles.push({ name: file.name, type: file.type || 'text/plain', content: reader.result, isImage: false }); resolve(); };
            }
        });
    }

    function renderFileBar() {
        filePreviewBar.innerHTML = "";
        pendingFiles.forEach((f, i) => {
            const chip = document.createElement('div');
            chip.className = 'fp-chip';
            chip.innerHTML = `${f.isImage ? 'Img' : 'Doc'}: ${f.name} <button onclick="removeFile(${i})">✕</button>`;
            filePreviewBar.appendChild(chip);
        });
    }

    function removeFile(i) { pendingFiles.splice(i, 1); renderFileBar(); }

    function displayMsg(role, text, filesMeta, targetDiv = null) {
        const div = targetDiv || document.createElement('div');
        div.className = role === 'user' ? 'user-wrapper' : 'ai-msg';
        if (role === 'user') {
            let html = '';
            if (filesMeta && filesMeta.length) {
                filesMeta.forEach(f => {
                    if (f.isImage && f.dataUrl) html += `<div class="file-preview-bubble"><img src="${f.dataUrl}" alt="${f.name}"></div>`;
                    else html += `<div class="file-preview-bubble">File: <b>${f.name}</b></div>`;
                });
            }
            if (text) html += `<div class="user-msg">${escapeHtml(text)}</div>`;
            div.innerHTML = html;
        } else {
            div.innerHTML = marked.parse(text);
            div.querySelectorAll('pre').forEach(pre => {
                const b = document.createElement('button'); b.className = 'copy-btn'; b.innerText = 'Copy';
                b.onclick = () => { navigator.clipboard.writeText(pre.querySelector('code').innerText); b.innerText = 'Copied!'; setTimeout(() => b.innerText = 'Copy', 2000); };
                pre.appendChild(b);
            });
        }
        if (!targetDiv) chatWindow.appendChild(div);
        hljs.highlightAll();
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMsg(retryText = null) {
        const txt = retryText || inp.value.trim();
        if (!txt && pendingFiles.length === 0) return;
        if (!apiKey) { alert("Input API Key!"); return; }

        document.getElementById('welcome-screen').style.display = 'none';
        const sess = sessions.find(s => s.id === currentId);
        if (!sess.messages.length) sess.title = (txt || "File Upload").substring(0, 25);

        const isAnth = apiUrl.includes("anthropic");
        const filesSnapshot = [...pendingFiles];
        let userContent = filesSnapshot.length > 0 ? [] : txt;

        if (Array.isArray(userContent)) {
            filesSnapshot.forEach(f => {
                if (f.isImage) {
                    const b64 = f.content.split(',')[1];
                    if (isAnth) userContent.push({ type: "image", source: { type: "base64", media_type: f.type, data: b64 } });
                    else userContent.push({ type: "image_url", image_url: { url: f.content } });
                } else { userContent.push({ type: "text", text: `[File: ${f.name}]\n${f.content}` }); }
            });
            if (txt) userContent.push({ type: "text", text: txt });
        }

        const filesMeta = filesSnapshot.map(f => ({ name: f.name, isImage: f.isImage, dataUrl: f.isImage ? f.content : null }));
        if (!retryText) displayMsg('user', txt, filesMeta);

        sess.messages.push({ role: 'user', content: userContent, displayText: txt, filesMeta });
        inp.value = ""; pendingFiles = []; renderFileBar();

        isGen = true;
        document.getElementById('send-svg').style.display = 'none';
        document.getElementById('stop-svg').style.display = 'block';

        const thinkDiv = document.createElement('div');
        thinkDiv.className = 'thinking-bubble'; thinkDiv.innerText = 'Memproses...';
        chatWindow.appendChild(thinkDiv);

        abortController = new AbortController();
        try {
            let h = { "Content-Type": "application/json" };
            if (isAnth) {
                h["x-api-key"] = apiKey;
                h["anthropic-version"] = "2023-06-01";
                h["anthropic-dangerous-direct-browser-access"] = "true";
            } else { h["Authorization"] = `Bearer ${apiKey}`; }

            const body = { model: apiMod, messages: sess.messages.map(m => ({ role: m.role, content: m.content })) };
            if (isAnth) body.max_tokens = 4096;

            const res = await fetch(apiUrl, { method: 'POST', headers: h, body: JSON.stringify(body), signal: abortController.signal });
            thinkDiv.remove();
            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || "Koneksi Gagal");

            const aiText = isAnth ? data.content[0].text : data.choices[0].message.content;
            displayMsg('assistant', aiText);
            sess.messages.push({ role: 'assistant', content: aiText });
            saveData();
        } catch (e) {
            thinkDiv.remove();
            if (e.name !== 'AbortError') {
                const errDiv = document.createElement('div');
                errDiv.className = 'error-container';
                errDiv.innerHTML = `<b>Error:</b> ${e.message} <br> <button class="retry-btn" onclick="retryLast('${txt.replace(/'/g, "\\'")}')">Coba Lagi</button>`;
                chatWindow.appendChild(errDiv);
            }
        } finally { stopGen(); }
    }

    function retryLast(text) {
        const errors = document.querySelectorAll('.error-container');
        if (errors.length) errors[errors.length - 1].remove();
        sendMsg(text);
    }

    function handleAction() { if (isGen) { abortController.abort(); stopGen(); } else sendMsg(); }
    function stopGen() { isGen = false; document.getElementById('send-svg').style.display = 'block'; document.getElementById('stop-svg').style.display = 'none'; }
    function closeSidebar() { sidebar.classList.remove('open'); }
    function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ===== INIT =====
    document.getElementById('menu-btn').onclick = (e) => { e.stopPropagation(); sidebar.classList.add('open'); };
    inp.onkeypress = (e) => { if (e.key === 'Enter') handleAction(); };
    initDropdowns();
    if (!sessions.length) createNew(); else loadSess(currentId);
</script>
</body>
</html>
