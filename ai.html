<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hub Mega Ultimate v5</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root { --grad-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); --input-bg: rgba(15, 23, 42, 0.9); --sidebar-bg: rgba(10, 15, 25, 0.98); --accent: #38bdf8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--grad-bg); color: #f1f5f9; height: 100dvh; display: flex; justify-content: center; overflow: hidden; position: relative; }
        .app-container { width: 100%; max-width: 850px; height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }

        #menu-btn { position: absolute; top: 15px; left: 15px; z-index: 50; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; cursor: pointer; backdrop-filter: blur(10px); }
        #sidebar { position: fixed; top: 0; left: -320px; width: 310px; height: 100%; background: var(--sidebar-bg); z-index: 100; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px; display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        #sidebar.open { left: 0; }
        .sidebar-header { margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        
        #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 90; display: none; }
        #sidebar.open ~ #sidebar-overlay { display: block; }

        #new-chat-btn { background: transparent; border: 1px dashed var(--accent); color: var(--accent); padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; font-weight: bold; width: 100%; }
        #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .chat-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.03); cursor: pointer; font-size: 13px; border: 1px solid transparent; }
        .chat-item.active { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
        .del-btn { color: #94a3b8; background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px 5px; border-radius: 4px; }
        .del-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

        .settings-pane { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; overflow-y: auto; max-height: 45vh; }
        .setting-field label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .setting-field select, .setting-field input { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; font-size: 13px; outline: none; }
        #save-settings { background: var(--accent); color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px; padding-top: 70px; display: flex; flex-direction: column; gap: 20px; position: relative; scroll-behavior: auto; }
        #welcome-screen { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; pointer-events: none; transition: 0.3s; z-index: 1; }
        #welcome-screen h1 { font-size: 24px; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .user-wrapper { align-self: flex-end; max-width: 85%; z-index: 2; }
        .user-msg { background: #334155; padding: 12px 16px; border-radius: 18px 18px 4px 18px; cursor: pointer; font-size: 15px; word-wrap: break-word; }
        .ai-msg { align-self: flex-start; width: 100%; font-size: 15px; line-height: 1.6; word-wrap: break-word; z-index: 2; }

        pre { background: #000 !important; border-radius: 6px; margin: 15px 0; border: 1px solid #1e293b; position: relative; overflow-x: auto; }
        code { font-family: 'JetBrains Mono', monospace; font-size: 13px; display: block; padding: 12px !important; white-space: pre; }
        .copy-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(255,255,255,0.1); color: #94a3b8; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }

        .thinking-bubble { align-self: flex-start; background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 4px 18px 18px 18px; color: var(--accent); font-size: 14px; margin-bottom: 10px; }

        #input-area { padding: 20px; display: flex; gap: 10px; align-items: center; z-index: 10; }
        #inp { flex: 1; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 14px 20px; color: white; outline: none; }
        #send-btn { background: var(--accent); border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        #send-btn svg { width: 22px; height: 22px; fill: #0f172a; }
    </style>
</head>
<body>

<button id="menu-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>

<div id="sidebar">
    <div class="sidebar-header"><h3>AI Hub Sessions</h3></div>
    <button id="new-chat-btn" onclick="createNew()">➕ Obrolan Baru</button>
    <div id="chat-list"></div>
    <div class="settings-pane">
        <div class="setting-field"><label>API Key</label><input type="password" id="set-key" placeholder="Key Anda..."></div>
        <div class="setting-field">
            <label>Endpoint</label>
            <select id="set-url">
                <option value="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions">Google Gemini API</option>
                <option value="https://api.bluesminds.com/v1/chat/completions">Bluesminds Multi-API</option>
                <option value="https://api.anthropic.com/v1/messages">Anthropic Claude (Resmi)</option>
                <option value="https://api.openai.com/v1/chat/completions">OpenAI ChatGPT (Resmi)</option>
                <option value="https://api.groq.com/openai/v1/chat/completions">Groq Cloud (Super Fast)</option>
                <option value="https://api.deepseek.com/chat/completions">DeepSeek Official</option>
                <option value="custom_url">➕ Tambah Endpoint Manual...</option>
            </select>
        </div>
        <div class="setting-field">
            <label>AI Model</label>
            <select id="set-mod">
                <optgroup label="Claude - Bluesminds">
                    <option value="claude-opus-4-6">Claude Opus 4.6 (Rajanya Coding)</option>
                    <option value="claude-4-5-sonnet">Claude 4.5 Sonnet</option>
                    <option value="claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                </optgroup>
                <optgroup label="Gemini - Google">
                    <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (The Best)</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro (Stabil)</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                </optgroup>
                <optgroup label="DeepSeek & Qwen">
                    <option value="deepseek-reasoner">DeepSeek Reasoner (Logic)</option>
                    <option value="qwen/qwen3-coder-480b-a35b-instruct">Qwen3 Coder 480b</option>
                </optgroup>
                <optgroup label="OpenAI - ChatGPT">
                    <option value="gpt-5-2">GPT-5.2 (Future)</option>
                    <option value="gpt-4o">GPT-4o (Omni)</option>
                </optgroup>
                <option value="custom_mod">➕ Tambah Model Manual...</option>
            </select>
        </div>
        <button id="save-settings" onclick="saveSettings()">Simpan & Terapkan</button>
    </div>
</div>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="app-container" onclick="closeSidebar()">
    <div id="welcome-screen"><h1>Mau tanya apa hari ini?</h1></div>
    <div id="chat-window"></div>
    <div id="input-area">
        <input type="text" id="inp" placeholder="Ketik pesan..." autocomplete="off">
        <button id="send-btn" onclick="handleAction()">
            <svg id="send-svg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            <svg id="stop-svg" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="#0f172a"><rect x="6" y="6" width="12" height="12"></rect></svg>
        </button>
    </div>
</div>

<script>
    let sessions = JSON.parse(localStorage.getItem('sessions')) || [];
    let currentId = localStorage.getItem('current_id') || null;
    let apiKey = localStorage.getItem('api_key') || "";
    let apiUrl = localStorage.getItem('api_url') || "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions";
    let apiMod = localStorage.getItem('api_mod') || "gemini-3.1-pro-preview";
    let customUrls = JSON.parse(localStorage.getItem('c_urls')) || [];
    let customMods = JSON.parse(localStorage.getItem('c_mods')) || [];
    let isGen = false, abortController = null;

    const chatWindow = document.getElementById('chat-window'), inp = document.getElementById('inp'), sidebar = document.getElementById('sidebar');

    function initDropdowns() {
        const urlSel = document.getElementById('set-url'), modSel = document.getElementById('set-mod');
        customUrls.forEach(u => urlSel.add(new Option(u, u), urlSel.options.length - 1));
        if(customMods.length) {
            let g = document.createElement('optgroup'); g.label = "Custom Models";
            customMods.forEach(m => g.appendChild(new Option(m, m)));
            modSel.insertBefore(g, modSel.lastElementChild);
        }
        document.getElementById('set-key').value = apiKey;
        urlSel.value = apiUrl; modSel.value = apiMod;
    }

    document.getElementById('set-url').onchange = function() {
        if(this.value === 'custom_url') {
            let val = prompt("Masukkan Endpoint URL:");
            if(val) { customUrls.push(val); localStorage.setItem('c_urls', JSON.stringify(customUrls)); location.reload(); }
            else { this.value = apiUrl; }
        }
    };
    document.getElementById('set-mod').onchange = function() {
        if(this.value === 'custom_mod') {
            let val = prompt("Masukkan Nama Model:");
            if(val) { customMods.push(val); localStorage.setItem('c_mods', JSON.stringify(customMods)); location.reload(); }
            else { this.value = apiMod; }
        }
    };

    function saveSettings() {
        apiKey = document.getElementById('set-key').value;
        apiUrl = document.getElementById('set-url').value;
        apiMod = document.getElementById('set-mod').value;
        localStorage.setItem('api_key', apiKey); localStorage.setItem('api_url', apiUrl); localStorage.setItem('api_mod', apiMod);
        closeSidebar();
    }

    function renderSessions() {
        const list = document.getElementById('chat-list'); list.innerHTML = "";
        sessions.forEach(s => {
            const div = document.createElement('div');
            div.className = `chat-item ${s.id === currentId ? 'active' : ''}`;
            div.onclick = (e) => { e.stopPropagation(); loadSess(s.id); closeSidebar(); };
            div.innerHTML = `<span>${s.title}</span><button class="del-btn" onclick="delSess('${s.id}', event)">🗑</button>`;
            list.appendChild(div);
        });
    }

    function createNew() {
        const active = sessions.find(s => s.id === currentId);
        if (active && !active.messages.length) { closeSidebar(); return; }
        const id = Date.now().toString();
        sessions.unshift({ id, title: "Obrolan Baru", messages: [] });
        currentId = id; saveData(); loadSess(id); closeSidebar();
    }

    function delSess(id, e) { 
        e.stopPropagation(); sessions = sessions.filter(s => s.id !== id); 
        if (!sessions.length) createNew(); else if (currentId === id) loadSess(sessions[0].id); 
        saveData(); renderSessions();
    }

    function loadSess(id) {
        currentId = id; chatWindow.innerHTML = "";
        const s = sessions.find(x => x.id === id);
        if (s) { s.messages.forEach(m => displayMsg(m.role, m.content)); document.getElementById('welcome-screen').style.display = s.messages.length ? 'none' : 'block'; }
        chatWindow.scrollTop = chatWindow.scrollHeight; renderSessions();
    }

    function saveData() { localStorage.setItem('sessions', JSON.stringify(sessions)); localStorage.setItem('current_id', currentId); }

    function displayMsg(role, content, targetDiv = null) {
        const div = targetDiv || document.createElement('div');
        div.className = role === 'user' ? 'user-wrapper' : 'ai-msg';
        if (role === 'user') div.innerHTML = `<div class="user-msg" onclick="editPrompt('${content.replace(/'/g, "\\'")}')">${content}</div>`;
        else {
            div.innerHTML = marked.parse(content);
            div.querySelectorAll('pre').forEach(pre => {
                const b = document.createElement('button'); b.className = 'copy-btn'; b.innerText = 'Copy';
                b.onclick = () => { navigator.clipboard.writeText(pre.querySelector('code').innerText); b.innerText = 'Copied!'; setTimeout(() => b.innerText = 'Copy', 2000); };
                pre.appendChild(b);
            });
        }
        if (!targetDiv) chatWindow.appendChild(div);
        hljs.highlightAll(); chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function editPrompt(txt) { inp.value = txt; inp.focus(); }

    function handleAction() { if (isGen) { if (abortController) abortController.abort(); stopGen(); } else sendMsg(); }

    function stopGen() {
        isGen = false; document.getElementById('send-btn').classList.remove('stop');
        document.getElementById('send-svg').style.display = 'block'; document.getElementById('stop-svg').style.display = 'none';
    }

    function closeSidebar() { sidebar.classList.remove('open'); }

    async function sendMsg() {
        const txt = inp.value.trim(); if (!txt || !apiKey) return;
        document.getElementById('welcome-screen').style.display = 'none';
        const sess = sessions.find(s => s.id === currentId);
        if (!sess.messages.length) sess.title = txt.substring(0, 20);

        displayMsg('user', txt); sess.messages.push({ role: 'user', content: txt }); inp.value = "";
        isGen = true; document.getElementById('send-btn').classList.add('stop'); document.getElementById('send-svg').style.display = 'none'; document.getElementById('stop-svg').style.display = 'block';

        const thinkDiv = document.createElement('div');
        thinkDiv.className = 'thinking-bubble'; thinkDiv.innerHTML = 'Sedang memproses...';
        chatWindow.appendChild(thinkDiv); chatWindow.scrollTop = chatWindow.scrollHeight;

        abortController = new AbortController();

        try {
            const isAnth = apiUrl.includes("anthropic");
            let h = { "Content-Type": "application/json" };
            let b = { model: apiMod, messages: sess.messages };
            if (isAnth) { 
                h["x-api-key"] = apiKey; 
                h["anthropic-version"] = "2023-06-01"; 
                h["anthropic-dangerous-direct-browser-access"] = "true"; 
                b.max_tokens = 4096; 
            } else {
                h["Authorization"] = `Bearer ${apiKey}`;
            }

            const res = await fetch(apiUrl, { 
                method: 'POST', headers: h, body: JSON.stringify(b), signal: abortController.signal
            });
            
            thinkDiv.remove();

            const data = await res.json();
            if (!res.ok) throw new Error(data.error?.message || "Koneksi Gagal");

            // Langsung tampilkan semua teks sekaligus (tanpa animasi per karakter)
            const fullText = isAnth ? data.content[0].text : data.choices[0].message.content;

            const aiMsgDiv = document.createElement('div');
            chatWindow.appendChild(aiMsgDiv);
            displayMsg('assistant', fullText, aiMsgDiv);

            sess.messages.push({ role: 'assistant', content: fullText }); 
            saveData();
        } catch (e) {
            thinkDiv.remove();
            if (e.name !== 'AbortError') {
                const errDiv = document.createElement('div');
                errDiv.style = "background:rgba(239,68,68,0.1); border:1px solid #ef4444; color:#fca5a5; padding:15px; border-radius:8px;";
                errDiv.innerHTML = `<b>Error:</b> ${e.message}`;
                chatWindow.appendChild(errDiv);
            }
        } finally { stopGen(); }
    }

    document.getElementById('menu-btn').onclick = (e) => { e.stopPropagation(); sidebar.classList.add('open'); };
    inp.onkeypress = (e) => { if(e.key === 'Enter') handleAction(); };
    initDropdowns();
    if (!sessions.length) createNew(); else loadSess(currentId);
</script>
</body>
</html>
