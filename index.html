<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINT PUBLIC OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, #7c3aed, #06b6d4, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 30px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            text-decoration: none;
            color: #fff;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .menu-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(124, 58, 237, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2);
        }
        .menu-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .menu-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .menu-desc {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.3;
        }
        .menu-item.mint { border-color: rgba(124,58,237,0.3); }
        .menu-item.mint:hover { border-color: #7c3aed; box-shadow: 0 10px 30px rgba(124,58,237,0.3); }
        .menu-item.deploy { border-color: rgba(59,130,246,0.3); }
        .menu-item.deploy:hover { border-color: #3b82f6; box-shadow: 0 10px 30px rgba(59,130,246,0.3); }
        .menu-item.dot { border-color: rgba(6,182,212,0.3); }
        .menu-item.dot:hover { border-color: #06b6d4; box-shadow: 0 10px 30px rgba(6,182,212,0.3); }
        .menu-item.studio { border-color: rgba(168,85,247,0.3); }
        .menu-item.studio:hover { border-color: #a855f7; box-shadow: 0 10px 30px rgba(168,85,247,0.3); }
        .menu-item.ai { border-color: rgba(16,185,129,0.3); }
        .menu-item.ai:hover { border-color: #10b981; box-shadow: 0 10px 30px rgba(16,185,129,0.3); }
        .menu-item.mail { border-color: rgba(234,179,8,0.3); }
        .menu-item.mail:hover { border-color: #eab308; box-shadow: 0 10px 30px rgba(234,179,8,0.3); }

        .menu-item.full-width {
            grid-column: 1 / -1;
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">MINT PUBLIC OS</div>
        <p class="subtitle">Multi-Chain Tools Dashboard</p>

        <div class="menu-grid">
            <a href="mint.html" class="menu-item mint">
                <div class="menu-icon">⛏️</div>
                <div class="menu-title">Mint</div>
                <div class="menu-desc">Loop Mint Multi-Chain</div>
            </a>
            <a href="deploy.html" class="menu-item deploy">
                <div class="menu-icon">🚀</div>
                <div class="menu-title">Deploy</div>
                <div class="menu-desc">Factory Manager Pro</div>
            </a>
            <a href="dot.html" class="menu-item dot">
                <div class="menu-icon">📧</div>
                <div class="menu-title">Dot Gmail</div>
                <div class="menu-desc">Email Variant Generator</div>
            </a>
            <a href="studio.html" class="menu-item studio">
                <div class="menu-icon">🎨</div>
                <div class="menu-title">Studio</div>
                <div class="menu-desc">NFT Studio Pro</div>
            </a>
            <a href="ai.html" class="menu-item ai">
                <div class="menu-icon">🤖</div>
                <div class="menu-title">AI Chat</div>
                <div class="menu-desc">Multi-Provider AI</div>
            </a>
            <a href="mail.html" class="menu-item mail">
                <div class="menu-icon">📬</div>
                <div class="menu-title">Temp Mail</div>
                <div class="menu-desc">Disposable Email</div>
            </a>
        </div>

        <p class="footer">MINT PUBLIC OS v1.0</p>
    </div>
</body>
</html>
