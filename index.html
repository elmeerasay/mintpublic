<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MintPublic Opensea</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg,#0f172a,#0ea5a4);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      margin:0;
    }
    .wrap {
      background: rgba(0,0,0,0.26);
      padding:24px;
      border-radius:12px;
      width:420px;
      box-shadow:0 8px 30px rgba(0,0,0,0.4);
    }
    h2{ margin:0 0 12px 0; font-size:18px; text-align:center; }
    label{ font-size:13px; opacity:0.95; display:block; margin-bottom:6px; }
    input[type="password"], input[type="number"]{
      width:100%;
      padding:9px 10px;
      margin:0 0 12px 0;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.15);
      background:rgba(255,255,255,0.05);
      color:#fff;
      font-size:14px;
      box-sizing:border-box;
    }
    .row { display:flex; gap:8px; margin-bottom:8px; }
    .row > * { flex:1; }
    .controls { display:flex; gap:8px; margin-top:6px; }
    .controls > button {
      flex:1;
      padding:10px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:700;
    }
    #mint { background:linear-gradient(90deg,#7c3aed,#06b6d4); color:#fff; }
    #stop { background:#ff4444; color:#fff; }
    #log {
      margin-top:14px;
      height:260px;
      overflow:auto;
      background:rgba(0,0,0,0.36);
      padding:10px;
      border-radius:8px;
      font-family: monospace;
      font-size:13px;
      color:#e6fffb;
    }
    .muted {
      opacity:0.9;
      font-size:12px;
      margin-top:10px;
      line-height:1.5em;
    }
    .muted span { display:block; }
    .credit { text-align:center; font-size:12px; margin-top:6px; opacity:0.8; }
    .log-success { color: #00ff88; font-weight:700; }
    .log-error { color: #ffaaaa; }
    .log-info { color: #c2f3ff; }
    a.tx-link { color:#80ffea; text-decoration:none; }
    a.tx-link:hover { text-decoration:underline; }
    button[disabled] { opacity:0.6; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>MintPublic Opensea</h2>

    <label for="pk">Private Key (0x...)</label>
    <input id="pk" type="password" placeholder="0x..." />

    <div class="row">
      <div>
        <label for="delay">Delay (detik)</label>
        <input id="delay" type="number" min="0" step="1" value="3" />
      </div>
      <div>
        <label for="maxloops">Max Loop (0 = tak terbatas)</label>
        <input id="maxloops" type="number" min="0" step="1" value="0" />
      </div>
    </div>

    <div class="controls">
      <button id="mint">Mulai Loop Mint</button>
      <button id="stop">Stop</button>
    </div>

    <div id="log" aria-live="polite"></div>

    <div class="muted">
      <span>↠ Jaringan Apechain</span>
      <span>↠ GasLimit: 2000000</span>
      <span>↠ 10 clone per mint</span>
      <span>↠ Gunakan akun testnet / cadangan.</span>
    </div>
    <div class="credit">by fullochz</div>
  </div>

  <script>
    (function(){
      const ethersLib = window.ethers;
      if (!ethersLib) { alert("ethers.js gagal dimuat."); return; }

      // Konfigurasi tetap
      const RPC_URL = "https://rpc.apechain.com/http";
      const GAS_LIMIT = 2000000;
      const CLONE_COUNT = 10;
      const APESCAN_TX_PREFIX = "https://apescan.io/tx/";

      // Kontrak (dari skrip awal)
      const FACTORY_ADDR = "0x7CcCCBabE951De24Dba2E5373B27EA052C77186f";
      const MINT_HELPER = "0x00005EA00Ac477B1030CE78506496e8C2dE24bf5";
      const NFT_CONTRACT = "0x75785fc84D68C9848feC6ed602118c129db20367";
      const FEE_RECIPIENT = "0x0000a26b00c1F0DF003000390027140000fAa719";

      const factoryAbi = [
        "function createAndMintBatch(address mintHelper,address nftContract,address feeRecipient,address mainWallet,uint256 amount,uint256 count) payable returns (bool)"
      ];

      // Elemen UI
      const pkInput = document.getElementById("pk");
      const delayInput = document.getElementById("delay");
      const maxloopsInput = document.getElementById("maxloops");
      const mintBtn = document.getElementById("mint");
      const stopBtn = document.getElementById("stop");
      const logDiv = document.getElementById("log");

      let provider = null;
      let wallet = null;
      let factory = null;
      let running = false;
      let loopCount = 0;
      let maxLoops = 0;

      function log(text, cls="log-info") {
        const t = new Date().toLocaleTimeString();
        const el = document.createElement("div");
        el.className = cls;
        // allow HTML for tx link
        el.innerHTML = `[${t}] ${text}`;
        logDiv.prepend(el);
      }

      function sleep(ms){
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function doLoop() {
        try {
          const addr = await wallet.getAddress();
          factory = new ethersLib.Contract(FACTORY_ADDR, factoryAbi, wallet);

          log(`🔁 Loop mint dimulai... (Max loop: ${maxLoops === 0 ? "tak terbatas" : maxLoops})`, "log-info");
          loopCount = 0;

          while (running) {
            // check max loops
            if (maxLoops > 0 && loopCount >= maxLoops) {
              log(`ℹ️ Mencapai Max Loop (${maxLoops}). Menghentikan loop.`, "log-info");
              break;
            }

            loopCount++;
            log(`⛏️ [#${loopCount}] Minting ${CLONE_COUNT} clone...`, "log-info");

            try {
              const tx = await factory.createAndMintBatch(
                MINT_HELPER,
                NFT_CONTRACT,
                FEE_RECIPIENT,
                addr,
                1,
                CLONE_COUNT,
                { value: 0, gasLimit: GAS_LIMIT }
              );

              // buat link ke apescan
              const txHash = tx.hash;
              const txLink = APESCAN_TX_PREFIX + txHash;
              // tampilkan link yang bisa diklik
              log(`Tx dikirim: <a class="tx-link" href="${txLink}" target="_blank" rel="noopener noreferrer">${txHash}</a>`, "log-info");

              // tunggu konfirmasi; tetap menunggu tapi running flag akan menghentikan iterasi berikutnya jika user klik Stop
              const receipt = await tx.wait();

              if (receipt && receipt.status === 1) {
                log(`✅ SUKSES — Block ${receipt.blockNumber} (<a class="tx-link" href="${txLink}" target="_blank" rel="noopener noreferrer">lihat</a>)`, "log-success");
              } else {
                log(`⚠️ Transaksi selesai tapi gagal / status != 1 (status=${receipt && receipt.status}) — <a class="tx-link" href="${txLink}" target="_blank" rel="noopener noreferrer">lihat</a>`, "log-error");
              }
            } catch (txErr) {
              // jika txErr memiliki hash (rare), tampilkan juga; biasanya ini error sebelum tx submit
              const message = txErr && txErr.message ? txErr.message : String(txErr);
              log(`❌ Error saat minting: ${message}`, "log-error");
              console.error(txErr);
            }

            if (!running) break;

            // Delay, tetapi cek running setiap chunk supaya responsive ke Stop
            const delaySec = Number(delayInput.value) || 0;
            if (delaySec > 0) {
              log(`Menunggu ${delaySec} detik sebelum mint berikutnya...`, "log-info");
              const waitMs = delaySec * 1000;
              const chunk = 500;
              let waited = 0;
              while (running && waited < waitMs) {
                const rem = Math.min(chunk, waitMs - waited);
                // small sleep
                // eslint-disable-next-line no-await-in-loop
                await sleep(rem);
                waited += rem;
              }
            }
          }

          running = false;
          mintBtn.disabled = false;
          stopBtn.disabled = true;
          log("🛑 Loop berhenti.", "log-info");
        } catch (err) {
          running = false;
          mintBtn.disabled = false;
          stopBtn.disabled = true;
          log("Error utama: " + (err && err.message ? err.message : String(err)), "log-error");
          console.error(err);
        }
      }

      mintBtn.addEventListener("click", async () => {
        if (running) { log("Loop sudah berjalan.", "log-error"); return; }

        const pk = pkInput.value.trim();
        if (!pk) { log("Private key kosong", "log-error"); return; }
        if (!pk.startsWith("0x")) { log("Private key harus diawali 0x", "log-error"); return; }

        // parse max loops
        maxLoops = Number(maxloopsInput.value) || 0;
        if (maxLoops < 0) maxLoops = 0;

        try {
          provider = new ethersLib.providers.JsonRpcProvider(RPC_URL);
          wallet = new ethersLib.Wallet(pk, provider);
          const addr = await wallet.getAddress();
          log("✅ Wallet siap: " + addr, "log-info");
          running = true;
          mintBtn.disabled = true;
          stopBtn.disabled = false;
          // start loop (no await so UI not blocked)
          doLoop();
        } catch (e) {
          log("Error saat inisialisasi wallet: " + (e && e.message ? e.message : String(e)), "log-error");
          mintBtn.disabled = false;
          stopBtn.disabled = true;
        }
      });

      stopBtn.addEventListener("click", () => {
        if (!running) { log("Tidak ada loop yang berjalan.", "log-error"); return; }
        running = false;
        log("⏹️ Stop ditekan. Loop akan berhenti setelah transaksi aktif selesai.", "log-info");
      });

      // initial UI state
      stopBtn.disabled = true;
      log(`Siap. RPC: ${RPC_URL} | GasLimit: ${GAS_LIMIT} | Count: ${CLONE_COUNT}`, "log-info");
      log("Isi PK, atur Delay (detik) dan Max Loop lalu klik 'Mulai Loop Mint'.", "log-info");
    })();
  </script>
</body>
</html>
