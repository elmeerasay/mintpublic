<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteMail - Temp Email</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        h2 { margin-top: 0; font-size: 1.5rem; color: #1e293b; text-align: center; }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        input:focus { border-color: var(--primary); }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: #f1f5f9; color: #475569; border: 1px solid var(--border); }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .actions { display: flex; gap: 8px; margin-bottom: 25px; }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        #status { font-size: 0.8rem; color: #64748b; }

        .msg-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .msg-head { font-weight: bold; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; margin-bottom: 8px; color: var(--primary); }
        .msg-body { white-space: pre-wrap; color: #334155; line-height: 1.5; font-family: monospace; background: #f9fafb; padding: 10px; border-radius: 5px; }
        
        .empty { text-align: center; color: #94a3b8; padding: 40px 0; font-style: italic; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #334155; color: white; padding: 8px 20px;
            border-radius: 20px; font-size: 0.9rem; display: none; z-index: 100;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Temp Mail</h2>

    <div class="input-group">
        <input type="text" id="emailInput" placeholder="Ketik email atau klik Generate...">
        <button class="btn btn-outline" onclick="copyEmail()" title="Salin Email">📋</button>
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="genBtn" onclick="generateNew()" style="flex: 2;">🔄 Generate Baru</button>
        <button class="btn btn-outline" id="cekBtn" onclick="manualCheck()" style="flex: 1;">📥 Cek Inbox</button>
    </div>

    <div class="inbox-section">
        <div class="inbox-header">
            <strong>Kotak Masuk</strong>
            <span id="status">Siap</span>
        </div>
        <div id="inbox">
            <div class="empty">Silakan buat email terlebih dahulu.</div>
        </div>
    </div>
</div>

<div id="toast">Disalin!</div>

<script>
    const API_BASE = 'https://tempomail.vercel.app/api/api';
    let checkInterval = null;

    async function generateNew() {
        const btn = document.getElementById('genBtn');
        const container = document.getElementById('inbox');
        
        // 1. Clear Inbox segera setelah klik
        container.innerHTML = '<div class="empty">Sedang menyiapkan email baru...</div>';
        document.getElementById('status').innerText = 'Membuat...';
        
        btn.disabled = true;
        
        try {
            const res = await fetch(`${API_BASE}?action=generate`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('emailInput').value = data.result.email;
                // Ganti teks loading di inbox
                container.innerHTML = '<div class="empty">Menunggu pesan pertama masuk...</div>';
                startAutoRefresh();
            }
        } catch (e) { 
            container.innerHTML = '<div class="empty">Gagal memuat email baru. Coba lagi.</div>';
        }
        
        btn.disabled = false;
    }

    function manualCheck() {
        const email = document.getElementById('emailInput').value;
        if (!email.includes('@')) return alert('Masukkan format email yang benar');
        
        const container = document.getElementById('inbox');
        container.innerHTML = '<div class="empty">Menghubungkan ke inbox...</div>';
        
        startAutoRefresh();
    }

    function startAutoRefresh() {
        if (checkInterval) clearInterval(checkInterval);
        fetchInbox();
        checkInterval = setInterval(fetchInbox, 4000); // Interval 4 detik agar lebih ringan
    }

    async function fetchInbox() {
        const email = document.getElementById('emailInput').value;
        const status = document.getElementById('status');
        const container = document.getElementById('inbox');
        if (!email) return;

        status.innerText = 'Memperbarui...';
        
        try {
            const res = await fetch(`${API_BASE}?action=inbox&email=${email}`);
            const data = await res.json();
            
            if (data.success && data.result.count > 0) {
                container.innerHTML = data.result.inbox.reverse().map(msg => `
                    <div class="msg-card">
                        <div class="msg-head">
                            DARI: ${msg.from}<br>
                            <span style="color:#64748b; font-size:0.8rem">Subjek: ${msg.subject}</span>
                        </div>
                        <div class="msg-body">${msg.message}</div>
                    </div>
                `).join('');
            } else {
                // Jika tidak ada pesan, biarkan pesan "Menunggu" tetap ada
                if(container.innerHTML.includes('msg-card')) {
                    container.innerHTML = '<div class="empty">Menunggu pesan masuk...</div>';
                }
            }
        } catch (e) { status.innerText = 'Error'; }
        
        setTimeout(() => { status.innerText = 'Auto-refresh Aktif'; }, 1000);
    }

    function copyEmail() {
        const email = document.getElementById('emailInput');
        if (!email.value) return;
        navigator.clipboard.writeText(email.value);
        const t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2000);
    }
</script>

</body>
</html>
