<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempoMail - Temporary Email Generator</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            max-width: 800px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            height: fit-content;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            font-size: 1.8rem;
        }

        .email-section {
            text-align: center;
            margin: 30px 0;
        }

        .email-display-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .email-display {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-main);
            background-color: var(--bg);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid var(--border);
            word-break: break-all;
            min-width: 300px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        .inbox-section {
            margin-top: 40px;
            border-top: 2px solid var(--border);
            padding-top: 20px;
        }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;
            background-color: #DEF7EC;
            color: #03543F;
            display: none; /* Hidden by default */
        }

        .message-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .message-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .msg-meta {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .msg-meta span {
            display: block;
            margin-bottom: 5px;
        }

        .msg-meta strong {
            color: var(--text-main);
        }

        .msg-body {
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.95rem;
            color: var(--text-main);
            background: #f9fafb;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #f3f4f6;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-style: italic;
        }

        /* Toast notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="container">
        <h1>TempoMail Generator</h1>
        
        <div class="email-section">
            <p style="color: var(--text-muted);">Alamat email sementara kamu:</p>
            <div class="email-display-container">
                <div class="email-display" id="emailAddress">Belum ada email</div>
                <button class="btn" style="padding: 15px;" onclick="copyEmail()" id="copyBtn" title="Copy Email">📋</button>
            </div>
            <button class="btn" id="generateBtn" onclick="generateNewEmail()">
                🔄 Generate Email Baru
            </button>
        </div>

        <div class="inbox-section">
            <div class="inbox-header">
                <h2>Kotak Masuk</h2>
                <span class="status-badge" id="refreshStatus">Mengecek...</span>
            </div>
            
            <div id="inboxContainer">
                <div class="empty-state">
                    Silakan generate email terlebih dahulu.
                </div>
            </div>
        </div>
    </div>

    <div id="toast">Email disalin ke clipboard!</div>

    <script>
        let currentEmail = '';
        let checkInterval = null;
        
        const API_BASE = 'https://tempomail.vercel.app/api/api';

        // Fungsi untuk generate email baru
        async function generateNewEmail() {
            const generateBtn = document.getElementById('generateBtn');
            const emailDisplay = document.getElementById('emailAddress');
            const inboxContainer = document.getElementById('inboxContainer');
            
            generateBtn.disabled = true;
            generateBtn.innerHTML = '⏳ Sedang membuat...';
            
            // Hentikan interval lama jika ada
            if (checkInterval) clearInterval(checkInterval);

            try {
                const response = await fetch(`${API_BASE}?action=generate`);
                const data = await response.json();

                if (data.success && data.result.email) {
                    currentEmail = data.result.email;
                    emailDisplay.textContent = currentEmail;
                    
                    // Reset inbox display
                    inboxContainer.innerHTML = '<div class="empty-state">Menunggu pesan masuk... <br><small>(Auto-refresh setiap 2 detik)</small></div>';
                    document.getElementById('refreshStatus').style.display = 'inline-block';
                    
                    // Mulai pengecekan inbox
                    startInboxCheck();
                } else {
                    emailDisplay.textContent = 'Gagal mengambil email';
                }
            } catch (error) {
                console.error('Error generating email:', error);
                emailDisplay.textContent = 'Terjadi kesalahan koneksi';
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '🔄 Generate Email Baru';
            }
        }

        // Fungsi untuk memulai interval pengecekan
        function startInboxCheck() {
            checkInbox(); // Cek langsung pertama kali
            checkInterval = setInterval(checkInbox, 2000); // Cek setiap 2000ms (2 detik)
        }

        // Fungsi untuk mengambil data inbox
        async function checkInbox() {
            if (!currentEmail) return;

            const refreshStatus = document.getElementById('refreshStatus');
            refreshStatus.textContent = 'Memuat ulang...';
            refreshStatus.style.backgroundColor = '#FEF3C7';
            refreshStatus.style.color = '#92400E';

            try {
                const response = await fetch(`${API_BASE}?action=inbox&email=${currentEmail}`);
                const data = await response.json();

                if (data.success && data.result.count > 0) {
                    renderInbox(data.result.inbox);
                } else if (data.success && data.result.count === 0) {
                    // Jika sebelumnya ada pesan tapi sekarang kosong, jangan hapus UI-nya
                    // atau bisa disesuaikan sesuai kebutuhan
                }
            } catch (error) {
                console.error('Error checking inbox:', error);
            } finally {
                setTimeout(() => {
                    refreshStatus.textContent = 'Aktif (Auto-refresh)';
                    refreshStatus.style.backgroundColor = '#DEF7EC';
                    refreshStatus.style.color = '#03543F';
                }, 500);
            }
        }

        // Fungsi untuk merender pesan ke dalam HTML
        function renderInbox(messages) {
            const container = document.getElementById('inboxContainer');
            container.innerHTML = ''; // Kosongkan container

            // Membalikkan array agar email terbaru (jika di akhir) muncul di atas
            const sortedMessages = messages.reverse();

            sortedMessages.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'message-card';
                card.innerHTML = `
                    <div class="msg-meta">
                        <span><strong>Dari:</strong> ${msg.from}</span>
                        <span><strong>Subjek:</strong> ${msg.subject}</span>
                        <span><strong>Waktu:</strong> ${msg.time}</span>
                    </div>
                    <div class="msg-body">${msg.message}</div>
                `;
                container.appendChild(card);
            });
        }

        // Fungsi tambahan untuk menyalin email
        function copyEmail() {
            if(!currentEmail) return;
            navigator.clipboard.writeText(currentEmail).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }
    </script>
</body>
</html>
