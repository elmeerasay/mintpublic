<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYS.DOT // GMAIL GENERATOR</title>
    
    <!-- Import Cyberpunk Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0221;
            --container-bg: #1a0b2e;
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-yellow: #fcee0a;
            --neon-green: #39ff14;
            --text-main: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.1);
            position: relative;
            margin-top: 10px;
        }

        /* Cyberpunk decorative elements */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px;
            width: 20px; height: 20px;
            border-top: 4px solid var(--neon-pink);
            border-left: 4px solid var(--neon-pink);
        }
        .container::after {
            content: '';
            position: absolute;
            bottom: -2px; right: -2px;
            width: 20px; height: 20px;
            border-bottom: 4px solid var(--neon-pink);
            border-right: 4px solid var(--neon-pink);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: var(--neon-pink);
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background-color: #000;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            border-color: var(--neon-pink);
        }

        input[type="text"]::placeholder {
            color: rgba(0, 255, 255, 0.3);
        }

        button.btn-execute {
            padding: 15px;
            border: none;
            background-color: var(--neon-yellow);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(252, 238, 10, 0.4);
        }

        button.btn-execute:active {
            transform: scale(0.98);
        }

        button.btn-execute:hover {
            background-color: #fff;
            box-shadow: 0 0 20px rgba(252, 238, 10, 0.8);
        }

        .result-container {
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            border-top: 1px dashed var(--neon-pink);
            padding-top: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--neon-yellow);
        }

        /* Style untuk list per email */
        .email-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .email-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid var(--neon-blue);
            padding: 12px;
            transition: all 0.2s;
        }
        
        .email-item:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        .email-text {
            font-size: 0.9rem;
            color: var(--text-main);
            word-break: break-all;
            margin-right: 10px;
        }

        .btn-copy-item {
            background-color: var(--neon-pink);
            color: #fff;
            border: none;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 255, 0.4);
            white-space: nowrap;
            transition: all 0.2s;
        }

        .btn-copy-item:active {
            transform: scale(0.95);
        }

        .btn-copy-item.copied {
            background-color: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
            pointer-events: none;
        }

        /* Pagination Styles */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .pagination button {
            flex: 1;
            padding: 10px;
            background-color: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }

        .pagination button:hover:not(:disabled) {
            background-color: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .pagination button:disabled {
            border-color: #333;
            color: #555;
            cursor: not-allowed;
            box-shadow: none;
        }

        .page-info {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            font-size: 0.85rem;
            text-align: center;
            flex: 1;
        }

        /* Modal / Alert Cyberpunk */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--container-bg);
            border: 2px solid var(--neon-pink);
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .modal-content h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-yellow);
            margin-bottom: 15px;
        }

        .modal-content p {
            color: var(--text-main);
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            background: var(--neon-blue);
            border: none;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-pink);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SYS.DOT // GMAIL</h2>
        <p class="subtitle">Multi-Variant Email Generator</p>

        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Enter target (ex: neo@gmail.com)" autocomplete="off">
            <button class="btn-execute" onclick="handleGenerateClick()">[ EXECUTE ]</button>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="status-bar">
                <span id="statusText">TOTAL: 0</span>
                <span style="color: var(--neon-green)" id="copiedCount">COPIED: 0</span>
            </div>
            
            <!-- List Container -->
            <div class="email-list" id="emailList">
                <!-- Items will be injected here via JS -->
            </div>
            
            <div class="pagination" id="paginationCtrl">
                <button id="prevBtn" onclick="changePage(-1)">&#9664; PREV</button>
                <div class="page-info" id="pageInfo">PG 1/1</div>
                <button id="nextBtn" onclick="changePage(1)">NEXT &#9654;</button>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-content">
            <h3 id="alertTitle">SYSTEM ERROR</h3>
            <p id="alertMessage">Error info here.</p>
            <button onclick="closeAlertModal()">ACKNOWLEDGE</button>
        </div>
    </div>

    <script>
        const inputEl = document.getElementById('usernameInput');
        const resultContainer = document.getElementById('resultContainer');
        const emailListContainer = document.getElementById('emailList');
        const statusText = document.getElementById('statusText');
        const copiedCountText = document.getElementById('copiedCount');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const alertModal = document.getElementById('alertModal');
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');

        let allResults = [];
        let currentPage = 1;
        const ITEMS_PER_PAGE = 50;
        
        // Mengambil daftar email yang sudah dicopy dari cache
        let copiedEmails = new Set(JSON.parse(localStorage.getItem('cyberdot_copied_list') || '[]'));

        // Auto Load Cache on Start
        document.addEventListener('DOMContentLoaded', () => {
            const cachedInput = localStorage.getItem('cyberdot_input');
            const cachedPage = localStorage.getItem('cyberdot_page');

            if (cachedInput) {
                inputEl.value = cachedInput;
                currentPage = cachedPage ? parseInt(cachedPage) : 1;
                processGeneration(cachedInput, false); 
            }
        });

        function showAlert(title, message) {
            alertTitle.innerText = title;
            alertMessage.innerText = message;
            alertModal.style.display = 'flex';
        }

        function closeAlertModal() {
            alertModal.style.display = 'none';
        }

        function generateDotVariations(username) {
            const domain = 'gmail.com';
            const results = [];
            const gaps = username.length - 1;
            const totalCombinations = Math.pow(2, gaps);

            for (let i = 0; i < totalCombinations; i++) {
                let currentVariation = username[0];
                for (let j = 0; j < gaps; j++) {
                    if ((i & (1 << j)) !== 0) {
                        currentVariation += '.';
                    }
                    currentVariation += username[j + 1];
                }
                results.push(`${currentVariation}@${domain}`);
            }
            return results;
        }

        function handleGenerateClick() {
            let textInput = inputEl.value.trim();
            
            // Jika user memasukkan username yang baru/berbeda, reset cache tombol yang sudah dicopy agar bersih
            const lastInput = localStorage.getItem('cyberdot_input');
            if (textInput !== lastInput) {
                copiedEmails.clear();
                localStorage.setItem('cyberdot_copied_list', '[]');
            }

            currentPage = 1; 
            processGeneration(textInput, true);
        }

        function processGeneration(rawInput, saveNewCache) {
            let username = rawInput;

            if (rawInput.includes('@')) {
                username = rawInput.split('@')[0];
            }

            if (username.length === 0) {
                if(saveNewCache) showAlert('INVALID INPUT', 'Target cannot be empty. Enter string data.');
                return;
            }
            if (username.length > 20) {
                showAlert('OVERFLOW WARNING', 'Max length exceeded. Keep target under 20 characters to prevent system crash.');
                return;
            }

            allResults = generateDotVariations(username);
            
            if (saveNewCache) {
                localStorage.setItem('cyberdot_input', rawInput);
                localStorage.setItem('cyberdot_page', currentPage);
            }

            renderCurrentPage();
        }

        function renderCurrentPage() {
            const totalItems = allResults.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            
            if(currentPage > totalPages) currentPage = totalPages;
            if(currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const pageData = allResults.slice(startIndex, endIndex);

            // Bersihkan List UI
            emailListContainer.innerHTML = '';

            // Render Item satu per satu
            pageData.forEach(email => {
                const isCopied = copiedEmails.has(email);

                const itemDiv = document.createElement('div');
                itemDiv.className = 'email-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'email-text';
                textSpan.innerText = email;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'btn-copy-item' + (isCopied ? ' copied' : '');
                copyBtn.innerText = isCopied ? '[ COPIED ]' : '[ COPY ]';
                
                // Event saat tombol diklik
                copyBtn.onclick = () => copySingleEmail(email, copyBtn);

                itemDiv.appendChild(textSpan);
                itemDiv.appendChild(copyBtn);
                emailListContainer.appendChild(itemDiv);
            });
            
            // Render Info UI
            statusText.innerText = `TOTAL: ${totalItems.toLocaleString('id-ID')}`;
            updateCopiedCountUI();
            pageInfo.innerText = `PG ${currentPage}/${totalPages}`;
            
            // Control Buttons
            prevBtn.disabled = (currentPage === 1);
            nextBtn.disabled = (currentPage === totalPages || totalPages === 0);

            resultContainer.style.display = 'flex';
            emailListContainer.scrollTop = 0;
            
            localStorage.setItem('cyberdot_page', currentPage);
        }

        function changePage(direction) {
            currentPage += direction;
            renderCurrentPage();
        }

        function copySingleEmail(text, btnElement) {
            // Trik khusus agar copy selalu sukses di Canvas/iFrame maupun Mobile
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                
                // Ubah status tombol
                btnElement.classList.add('copied');
                btnElement.innerText = '[ COPIED ]';

                // Simpan ke Cache History agar permanen
                copiedEmails.add(text);
                localStorage.setItem('cyberdot_copied_list', JSON.stringify([...copiedEmails]));
                
                updateCopiedCountUI();
            } catch (err) {
                showAlert('ACCESS DENIED', 'Clipboard access restricted.');
            } finally {
                textArea.remove();
            }
        }

        function updateCopiedCountUI() {
            copiedCountText.innerText = `COPIED: ${copiedEmails.size}`;
        }
    </script>
</body>
  </html>
